# Workspace cargo configuration.
#
# ---------------------------------------------------------------------------
# libvpx (VP8 video encode) discovery for `env-libvpx-sys`
# ---------------------------------------------------------------------------
# `crates/transport-webrtc` encodes the WebRTC video track with **VP8** (libvpx). Unlike the
# openh264 crate it replaced, libvpx is NOT vendored — it is a native prerequisite that each
# developer/CI machine installs once:
#
#     vcpkg install libvpx:x64-windows-static
#
# The triplet MUST be `x64-windows-static` (/MT). The agent binaries are built with
# `RUSTFLAGS="-C target-feature=+crt-static"`, and mixing a /MD libvpx into a /MT link fails with
# LNK2038 ("mismatch detected for 'RuntimeLibrary'"). See docs/10-deployment.md.
#
# `env-libvpx-sys`'s build script looks for libvpx via pkg-config OR via these env vars. There is
# no pkg-config on a stock Windows box, so we point it at the vcpkg tree here. Cargo's `[env]`
# table IS visible to build scripts, so a plain `cargo build` works with no shell setup.
#
# Every entry uses `force = false` (cargo's default), so a developer who exports their own
# VPX_LIB_DIR / VPX_INCLUDE_DIR (different vcpkg root, a Linux distro package, a self-built
# libvpx) still wins.
#
# NOTE ON VPX_VERSION: env-libvpx-sys 5.1.3 ships PRE-GENERATED bindgen output (so clang/bindgen
# are not required) and its newest generated file is `vpx-ffi-1.13.0.rs`. The libvpx vcpkg
# currently installs is 1.16.0, for which it ships nothing — so VPX_VERSION selects the newest
# bindings it HAS. That is safe here: every struct we touch (`vpx_codec_enc_cfg`, `vpx_image`,
# `vpx_codec_ctx`, `vpx_codec_cx_pkt`) is field-for-field identical between the 1.13 bindings and
# the installed 1.16.0 headers. The one thing that DID change is the
# `VPX_ENCODER_ABI_VERSION` integer handed to `vpx_codec_enc_init_ver`, which
# `crates/transport-webrtc/src/video/vp8.rs` resolves at runtime instead of trusting the constant
# (see `encoder_abi_version` there).
#
# NOTE ON VPX_STATIC: deliberately NOT set. env-libvpx-sys emits
# `cargo:rustc-link-lib=static=libvpx` on Windows when it is set, i.e. it looks for `libvpx.lib` —
# but vcpkg's static triplet produces `vpx.lib`, so the link fails with LNK1181. Leaving it unset
# emits `cargo:rustc-link-lib=vpx` -> `vpx.lib`, which on MSVC is exactly the static archive we
# want (the x64-windows-static triplet ships no DLL at all, so this still links statically).
# ---------------------------------------------------------------------------
# libopus (Opus audio encode) discovery for crates/transport-webrtc/build.rs
# ---------------------------------------------------------------------------
# The WebRTC AUDIO track is Opus — mandatory-to-implement in WebRTC, decoded by every browser, and
# royalty-free with an explicit patent grant (the same property that decided VP8 over H.264).
# Like libvpx it is NOT vendored; it is a one-time prerequisite:
#
#     vcpkg install opus:x64-windows-static
#
# Same triplet requirement, same reason: the agent links /MT and a /MD libopus fails LNK2038.
# There is no `-sys` crate here — `transport-webrtc/src/audio.rs` declares the five libopus
# functions it uses directly, so only the search path is needed and no include dir or bindgen.
# `force = false`, so a developer with their own OPUS_LIB_DIR still wins.
[env]
OPUS_LIB_DIR = { value = "C:/vcpkg/installed/x64-windows-static/lib", force = false }
VPX_LIB_DIR = { value = "C:/vcpkg/installed/x64-windows-static/lib", force = false }
VPX_INCLUDE_DIR = { value = "C:/vcpkg/installed/x64-windows-static/include", force = false }
VPX_VERSION = { value = "1.13.0", force = false }
