<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewer chrome harness</title>
    <style>
      /* The ONLY styling here. Everything visible comes from the product's own index.css, which
         viewer_chrome.tsx imports — a harness that restyled the bars it exists to measure would be
         measuring itself. This just gives the Viewer the full-height flex parent that
         `.app__main > .app__session` gives it in the real shell, so `flex: 1` resolves. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./viewer_chrome.tsx"></script>
  </body>
</html>
