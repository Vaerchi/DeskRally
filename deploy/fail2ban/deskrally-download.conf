# fail2ban filter: repeated SUCCESSFUL fetches of the support download from one IP.
#
# DETECTION, NOT PREVENTION (docs/27 step 15, docs/28 §2 #2). Nothing in front of /download today
# rate-limits it — a ~19 MB anonymous body shares the one public listener with the console API and
# the /ws signaling socket. This jail only makes an abusive pattern VISIBLE and optionally bans a
# single source; it is not a substitute for real rate limiting, which must be chosen before the URL
# is announced anywhere. The status-based @probe 404s in the Caddyfile are what make a jail like this
# possible at all: a status field only means something once hostile paths stop answering 200.
#
# It keys on a 200 to a path under /download/ — a SERVED artifact, not a 404 — so it counts real
# downloads, not scanner noise. Caddy writes JSON access logs (see the Caddyfile `log` block); this
# matches the flattened JSON. `datepattern` reads Caddy's numeric `ts` (epoch seconds).
#
# Validate against a real captured line before trusting it:
#   fail2ban-regex /path/to/access.log deploy/fail2ban/deskrally-download.conf --print-all-matched

[Definition]
# Caddy JSON: "request":{"remote_ip":"1.2.3.4",...,"uri":"/download/..."},...,"status":200
# Order is not guaranteed across Caddy versions, so match remote_ip and the /download 200 loosely
# rather than assuming a fixed field order.
failregex = ^.*"remote_ip":"<HOST>".*"uri":"/download/[^"]*".*"status":200.*$

# Caddy's `ts` is a float epoch (e.g. 1.699e9). This tells fail2ban to read epoch time from the line
# and not to try to parse a human date it will never find.
datepattern = "ts":{EPOCH}

# We never want to ban on a 404 or a probe, so nothing here matches those.
ignoreregex =
